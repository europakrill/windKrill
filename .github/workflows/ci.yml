name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p krill-vt -p krill-core -p krill-transport -p krill-session --all-targets -- -D warnings
      - name: Tests
        # Includes the real Windows ConPTY and session actor integration tests.
        run: cargo test -p krill-vt -p krill-core -p krill-transport -p krill-session

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile-exact)
        run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Audit (runtime deps)
        run: npm audit --omit=dev
