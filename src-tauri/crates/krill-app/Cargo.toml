[package]
name = "krill-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tauri application layer: commands bridging GUI frontend to the krill engine"

[[bin]]
name = "windkrill"
path = "src/main.rs"

[lib]
name = "krill_app_lib"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
krill-core = { path = "../krill-core" }
krill-vt = { path = "../krill-vt" }
krill-transport = { path = "../krill-transport" }
krill-session = { path = "../krill-session" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
