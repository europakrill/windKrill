[package]
name = "krill-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Session transport layer: ConPTY/local shell, SSH (russh), Telnet, Serial, RawTcp"

[dependencies]
krill-core = { path = "../krill-core" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9.0"
